name: Quality checks

on:
  pull_request:
  push:
    branches: [main, engineering-foundation]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/link_test
        run: npm run prisma:validate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/link_test
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
